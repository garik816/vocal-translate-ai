name: Alignment regression tests

on:
  push:
    branches: [main, "fix/**", "feat/**"]
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install small test dependencies
        run: python -m pip install PyYAML cmudict
      - name: Compile Python sources
        run: python -m compileall -q app.py vta scripts tests
      - name: Run alignment tests
        run: python -m unittest discover -s tests -v
